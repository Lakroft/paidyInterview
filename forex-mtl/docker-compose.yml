version: '3.8'

services:
  one-frame:
    image: paidyinc/one-frame
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rates?pair=USDJPY"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  forex-mtl:
    build: .
    ports:
      - "8085:8080"
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
      - ONEFRAME_URL=http://one-frame:8080
      - ONEFRAME_TOKEN=10dc303535874aeccc86a8251e6992f5
      - CACHE_TTL=5m
    depends_on:
      - one-frame
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rates?from=USD&to=EUR"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped